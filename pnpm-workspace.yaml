packages:
  - apps/*
  - packages/*

# Dependências que podem rodar scripts de instalação. O pnpm bloqueia as demais.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: false
  prisma: true

# Versões compartilhadas. Nos package.json, use "catalog:" em vez do número.
catalog:
  "@anthropic-ai/sdk": 0.130.0
  "@biomejs/biome": 2.5.14
  "@prisma/adapter-pg": 7.10.0
  "@prisma/client": 7.10.0
  "@tailwindcss/postcss": 4.3.3
  "@types/luxon": 3.7.6
  "@types/node": ^24.0.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  bullmq: 6.3.10
  dotenv: 18.0.4
  fastify: 5.12.5
  ioredis: 6.0.0
  luxon: 3.7.2
  next: 16.3.8
  pino: 10.3.1
  pino-pretty: 13.1.3
  postcss: 8.5.28
  prisma: 7.10.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  tsx: 4.23.15
  turbo: 2.11.5
  typescript: 6.0.3
  vitest: 5.0.2
  zod: 4.6.5

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.130.0'
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
